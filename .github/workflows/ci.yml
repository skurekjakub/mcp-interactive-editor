name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # The guard does path resolution, symlink checks and atomic renames, so
        # it earns a run on every platform it claims to support.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Type-aware linting reads the same tsconfigs on every platform and
        # cannot disagree between them, so once is enough.
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Dead code and unused dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint:dead

      - name: Audit what ships
        # Only the runtime dependencies. Dev-only advisories with no fix
        # available would red-line every run over a packing tool no user
        # installs.
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

      - name: Format
        run: npm run format:check

      - name: Comment policy
        run: npm run lint:comments

      - name: Test
        run: npm test

      - name: Fail if the symlink-escape test was skipped
        # That test is the flagship containment guarantee. It self-skips where
        # the platform will not create a symlink, which is legitimate on
        # Windows and never on Linux — so a skip there is a silent hole.
        if: matrix.os == 'ubuntu-latest'
        run: npx vitest run test/unit/fsGuard.test.ts --reporter=json --outputFile=fsguard.json &&
          node -e "const r=require('./fsguard.json');if(r.numPendingTests>0){console.error('::error::a
          containment test was skipped on Linux');process.exit(1)}"

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard below compares against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run bundle

      - name: Fail if the committed bundle is stale
        # bundle/ ships to Claude Code plugin users straight from the repo, so a
        # bundle that disagrees with src/ means they install yesterday's server.
        run: git diff --exit-code -- bundle/ || (echo "::error::bundle/ is out of date — run 'npm run bundle' and commit it" && exit 1)

      - name: Fail if the code changed without a version bump
        # Claude Code caches an installed plugin under its declared version and
        # rebuilds only when that number changes, so shipping a change without a
        # bump leaves every existing install on the tree it first installed. The
        # symptom is indistinguishable from a restart that did not take.
        #
        # Compared against the last release rather than the merge base, so a
        # commit pushed straight to main is checked too. Gating this on
        # pull_request let a direct push land source changes under a version
        # already published, which is two different builds answering to one
        # number — the exact thing the rule exists to prevent.
        run: |
          git fetch --tags --quiet
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            echo "No release to compare against yet."
            exit 0
          fi
          changed=$(git diff --name-only "$last"...HEAD -- src shared ui | wc -l)
          if [ "$changed" -eq 0 ]; then
            echo "No source changes since $last; no bump required."
            exit 0
          fi
          released=${last#v}
          declared=$(node -pe 'require("./package.json").version')
          if [ "$released" = "$declared" ]; then
            echo "::error::src/, shared/ or ui/ changed since $last but the version is still $declared — run 'npm run bump -- <next>'"
            exit 1
          fi
          echo "Source moved since $last, and the version moved $released -> $declared."

      - name: Pack the extension
        # `mcpb pack` validates the manifest against its schema, which nothing
        # else in the pipeline does. A manifest regression would otherwise
        # surface for the first time at release.
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

      - name: Report the extension checksum
        # server.json pins fileSha256 for the published artifact, and registry
        # clients verify it before installing.
        run: |
          sha=$(sha256sum dist/mcp-interactive-editor.mcpb | cut -d' ' -f1)
          echo "### Extension checksum" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$sha"'`' >> "$GITHUB_STEP_SUMMARY"

name: release

# Triggered by hand, from the Actions tab or `gh workflow run release.yml`.
# Releasing on a tag push would mean the tag is the decision, and a tag pushed
# by mistake cannot be taken back once installs have seen it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.1. Must already be committed."
        required: true
        type: string
      draft:
        description: "Publish as a draft first"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Refuse a version the tree does not declare
        # The whole point of the bump script is that every declaration moves
        # together. Releasing a version the tree does not claim would ship an
        # artifact whose manifest disagrees with its own tag.
        run: |
          declared=$(node -pe 'require("./package.json").version')
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::asked to release ${{ inputs.version }} but the tree declares $declared — run 'npm run bump -- ${{ inputs.version }}' first"
            exit 1
          fi
          node --input-type=module -e "
            const { versionDrift } = await import('./scripts/versions.mjs');
            const drift = versionDrift();
            if (drift.length) {
              console.error('::error::the declared versions disagree: ' + drift.join('; '));
              process.exit(1);
            }
          "

      - name: Refuse a version that is already tagged
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ inputs.version }} already exists — releasing over it would change what an existing install resolves to"
            exit 1
          fi

      - name: Refuse a version the changelog does not describe
        run: |
          if ! grep -q "^## \[${{ inputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${{ inputs.version }}"
            exit 1
          fi

      - name: Verify
        run: npm run verify

      - name: Pack the extension
        run: npm run pack

      - name: Read the checksum
        id: checksum
        # Registry clients verify this before installing, so it has to be the
        # hash of the artifact that is actually uploaded. Packing is not
        # reproducible — zip entries carry mtimes — so a hash taken from any
        # other build describes a different file.
        run: |
          sha=$(sha256sum dist/mcp-interactive-editor.mcpb | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "### Extension checksum" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$sha"'`' >> "$GITHUB_STEP_SUMMARY"

      - name: Describe the release in server.json, before it is tagged
        # This has to land *before* the tag, or the tagged tree describes the
        # previous release: check out the tag and server.json names the old
        # artifact and the old checksum. Committing it afterwards leaves that
        # contradiction in the history permanently.
        #
        # The chicken-and-egg is real — the checksum cannot exist before the
        # artifact — so the artifact is built here, the file is written here,
        # and only then is anything tagged.
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.version = version;
            s.packages[0].version = version;
            s.packages[0].identifier =
              `https://github.com/${process.env.REPO}/releases/download/v${version}/mcp-interactive-editor.mcpb`;
            s.packages[0].fileSha256 = process.env.SHA256;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          '
          npx prettier --write server.json
          if git diff --quiet -- server.json; then
            echo "server.json already describes this release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.json
          git commit -m "Describe the v${{ inputs.version }} artifact in server.json"
          git push origin "HEAD:${{ github.ref_name }}"
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}

      - name: Take the notes from the changelog
        id: notes
        # The changelog section is the release note. Writing it twice is how the
        # two end up saying different things.
        run: |
          awk -v h="## [${{ inputs.version }}]" '
            index($0, h) == 1 { inside = 1; next }
            inside && index($0, "## ") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo
            echo "**Install:** download \`mcp-interactive-editor.mcpb\` below and open it, or add the plugin marketplace \`skurekjakub/mcp-interactive-editor\` in Claude Code."
            echo
            echo "\`sha256\` \`${{ steps.checksum.outputs.sha256 }}\`"
          } >> notes.md
          test -s notes.md || { echo "::error::empty release notes"; exit 1; }

      - name: Tag the tree that describes itself
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/mcp-interactive-editor.mcpb \
            --title "v${{ inputs.version }}" \
            --notes-file notes.md \
            ${{ inputs.draft && '--draft' || '' }}
